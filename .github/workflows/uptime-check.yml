name: Uptime Check

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping health endpoint
        id: health
        run: |
          RESPONSE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            --max-time 20 \
            "https://twv-crm.vercel.app/api/health")

          echo "http_code=$RESPONSE" >> $GITHUB_OUTPUT

          if [ -f /tmp/health.json ]; then
            STATUS=$(python3 -c "import json; d=json.load(open('/tmp/health.json')); print(d.get('status','unknown'))" 2>/dev/null || echo "parse_error")
            LATENCY=$(python3 -c "import json; d=json.load(open('/tmp/health.json')); print(d.get('latency_ms', 0))" 2>/dev/null || echo "0")
            STALE=$(python3 -c "import json; d=json.load(open('/tmp/health.json')); print(','.join(d.get('stale_crons',[])) or 'none')" 2>/dev/null || echo "unknown")
            DB=$(python3 -c "import json; d=json.load(open('/tmp/health.json')); print(d.get('db','unknown'))" 2>/dev/null || echo "unknown")
          else
            STATUS="unreachable"
            LATENCY="0"
            STALE="unknown"
            DB="unknown"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "latency=$LATENCY" >> $GITHUB_OUTPUT
          echo "stale=$STALE" >> $GITHUB_OUTPUT
          echo "db=$DB" >> $GITHUB_OUTPUT

          echo "=== Health check result ==="
          echo "HTTP: $RESPONSE | Status: $STATUS | DB: $DB | Latency: ${LATENCY}ms | Stale crons: $STALE"

      - name: Alert if degraded
        if: steps.health.outputs.http_code != '200' || steps.health.outputs.status != 'ok'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          HTTP_CODE="${{ steps.health.outputs.http_code }}"
          STATUS="${{ steps.health.outputs.status }}"
          LATENCY="${{ steps.health.outputs.latency }}"
          STALE="${{ steps.health.outputs.stale }}"
          DB="${{ steps.health.outputs.db }}"
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")

          # Build alert message
          if [ "$HTTP_CODE" != "200" ]; then
            REASON="Site unreachable (HTTP $HTTP_CODE)"
          elif [ "$DB" != "connected" ]; then
            REASON="Database connection failed"
          elif [ "$STATUS" = "degraded" ] && [ "$STALE" != "none" ]; then
            REASON="Stale cron jobs: $STALE"
          else
            REASON="Health check returned status: $STATUS"
          fi

          HTML="<div style='font-family:sans-serif;max-width:600px;margin:0 auto'>
            <div style='background:#dc2626;padding:20px 32px'>
              <h1 style='color:white;margin:0;font-size:20px'>🔴 TWV CRM Alert</h1>
              <p style='color:#fecaca;margin:4px 0 0;font-size:12px'>Production Uptime Monitor</p>
            </div>
            <div style='padding:32px;border:1px solid #e5e7eb;border-top:none'>
              <p style='font-size:16px;font-weight:bold;color:#dc2626'>$REASON</p>
              <table style='width:100%;border-collapse:collapse;margin:16px 0'>
                <tr><td style='padding:8px;color:#6b7280;font-size:13px'>Time</td><td style='padding:8px;font-size:13px'>$NOW</td></tr>
                <tr style='background:#f9fafb'><td style='padding:8px;color:#6b7280;font-size:13px'>HTTP Status</td><td style='padding:8px;font-size:13px'>$HTTP_CODE</td></tr>
                <tr><td style='padding:8px;color:#6b7280;font-size:13px'>Health Status</td><td style='padding:8px;font-size:13px'>$STATUS</td></tr>
                <tr style='background:#f9fafb'><td style='padding:8px;color:#6b7280;font-size:13px'>Database</td><td style='padding:8px;font-size:13px'>$DB</td></tr>
                <tr><td style='padding:8px;color:#6b7280;font-size:13px'>Latency</td><td style='padding:8px;font-size:13px'>${LATENCY}ms</td></tr>
                <tr style='background:#f9fafb'><td style='padding:8px;color:#6b7280;font-size:13px'>Stale Crons</td><td style='padding:8px;font-size:13px'>$STALE</td></tr>
              </table>
              <div style='text-align:center;margin:24px 0'>
                <a href='https://twv-crm.vercel.app/api/health' style='background:#015E65;color:white;padding:10px 24px;text-decoration:none;border-radius:6px;font-weight:bold;display:inline-block;font-size:14px'>View Health Endpoint</a>
              </div>
              <p style='color:#9ca3af;font-size:12px;margin-top:16px'>This alert was triggered by the GitHub Actions uptime monitor. Check <a href='https://github.com/vinit2776/TWVCRM/actions/workflows/uptime-check.yml'>workflow logs</a> for details.</p>
            </div>
            <div style='background:#015E65;padding:12px 32px;text-align:center'>
              <p style='color:#fff;margin:0;font-size:10px'>SREE DESIGN INFRASTRUCTURE PVT LTD | The WorkVilla</p>
            </div>
          </div>"

          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"TWV CRM Monitor <monitor@theworkvilla.com>\",
              \"to\": [\"$ALERT_EMAIL\"],
              \"subject\": \"🔴 TWV CRM DOWN — $REASON ($NOW)\",
              \"html\": $(echo "$HTML" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            }" && echo "Alert email sent"

      - name: All good
        if: steps.health.outputs.http_code == '200' && steps.health.outputs.status == 'ok'
        run: echo "✅ Health OK — HTTP 200, status ok, DB connected, latency ${{ steps.health.outputs.latency }}ms"
