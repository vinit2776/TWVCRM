name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for duplicate migration numbers
        run: |
          DUPES=$(ls supabase/migrations/*.sql | xargs -I{} basename {} | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "❌ Duplicate migration numbers found: $DUPES"
            echo "Two files with the same prefix cause supabase db push to silently skip one,"
            echo "leaving production with missing columns. Rename before merging."
            exit 1
          fi
          echo "✅ No duplicate migration numbers"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
