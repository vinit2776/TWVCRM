name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + all remote refs: the migration-number check compares
          # this branch against main and every other branch.
          fetch-depth: 0

      - name: Fetch remote branches for the migration check
        run: git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The previous version of this step only looked for duplicates *within*
      # the checked-out tree, which never fires — a branch only ever holds one
      # file per number. Every collision this repo has actually hit was
      # cross-branch: two people pick the same next number on the same
      # afternoon and whoever pushes second is silently dropped by db push.
      # Catching that needs main and the other branches, hence fetch-depth: 0.
      - name: Check migration numbers
        run: node .github/scripts/check-migration-numbers.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Heap size lives in the "build" script in package.json, not here — this job
      # used to set NODE_OPTIONS itself, which meant CI built fine while a plain
      # local `npm run build` still died on Node's ~4GB default.
      - name: Build
        run: npm run build
