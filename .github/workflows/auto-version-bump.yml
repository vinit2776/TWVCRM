name: Auto bump version

on:
  push:
    branches: [main]

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    # Skip if this push was the bump PR merging — prevents an infinite loop.
    # Matched via a marker in the commit message rather than a prefix, since
    # the commit's first line depends on which merge method is used (squash
    # keeps the PR title as-is; "create a merge commit" prepends "Merge pull
    # request #N from ..." instead) — the marker survives either way because
    # it's still present somewhere in the full message.
    if: "!contains(github.event.head_commit.message, '[auto-bump]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The "Mainprotect" ruleset (added 2026-08-25) now requires every change
      # to main go through a PR with a passing lint-and-build check and a
      # code-owner review — a direct bot push (what this workflow did before)
      # is rejected outright, not just raced. The Actions bot isn't eligible
      # for the ruleset's bypass list on a personal-account repo (org-only
      # feature), so there's no way to keep pushing straight to main here.
      #
      # Instead this keeps ONE persistent branch/PR that stays rebased onto
      # main's current tip on every run, rather than opening a fresh PR per
      # push — otherwise every real merge would spawn another tiny bump PR
      # before the last one was even reviewed.
      - name: Compute bump and open/update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/version-bump"
          git fetch --quiet origin main
          git checkout -B "$BRANCH" origin/main

          NEW_VERSION=$(node .github/scripts/bump-version.mjs)
          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "Nothing to commit — ${BRANCH} already matches main."
            exit 0
          fi

          TITLE="chore: bump version to ${NEW_VERSION} [auto-bump]"
          BODY="Automated version bump. The Mainprotect ruleset requires a PR for every change to main, so this can no longer push directly — merge whenever convenient. This PR is kept up to date automatically; no need to close and reopen it."

          git commit --quiet -m "$TITLE"
          git push --quiet --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "Updated existing bump PR to ${NEW_VERSION}."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "Opened bump PR for ${NEW_VERSION}."
          fi
