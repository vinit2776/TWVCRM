name: Auto bump version

on:
  push:
    branches: [main]

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    # Skip if this push was the bump PR merging — prevents an infinite loop.
    # Checks only the FIRST LINE shape, not "does this text appear anywhere in
    # the message" — a bare contains() on a marker string is fooled by any
    # commit (including ones editing this very file) that quotes the marker
    # in its own description, which is exactly what broke the first version
    # of this guard on the PR that introduced it.
    #   - squash merge: first line is the PR title verbatim, so it starts
    #     with the fixed "chore: bump version to " prefix we always give it.
    #   - "create a merge commit": first line is always the mechanical
    #     "Merge pull request #N from OWNER/BRANCH" — checking BOTH that the
    #     message starts with that exact phrase AND names our specific branch
    #     means an unrelated commit would have to fake a real merge line to
    #     false-positive, not just mention the branch name in prose.
    if: >-
      !(
        startsWith(github.event.head_commit.message, 'chore: bump version to ') ||
        (startsWith(github.event.head_commit.message, 'Merge pull request #') && contains(github.event.head_commit.message, '/chore/version-bump'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The "Mainprotect" ruleset (added 2026-08-25) now requires every change
      # to main go through a PR with a passing lint-and-build check and a
      # code-owner review — a direct bot push (what this workflow did before)
      # is rejected outright, not just raced. The Actions bot isn't eligible
      # for the ruleset's bypass list on a personal-account repo (org-only
      # feature), so there's no way to keep pushing straight to main here.
      #
      # Instead this keeps ONE persistent branch/PR that stays rebased onto
      # main's current tip on every run, rather than opening a fresh PR per
      # push — otherwise every real merge would spawn another tiny bump PR
      # before the last one was even reviewed.
      - name: Compute bump and open/update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/version-bump"
          git fetch --quiet origin main
          git checkout -B "$BRANCH" origin/main

          NEW_VERSION=$(node .github/scripts/bump-version.mjs)
          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "Nothing to commit — ${BRANCH} already matches main."
            exit 0
          fi

          TITLE="chore: bump version to ${NEW_VERSION}"
          BODY="Automated version bump. The Mainprotect ruleset requires a PR for every change to main, so this can no longer push directly — merge whenever convenient. This PR is kept up to date automatically; no need to close and reopen it."

          git commit --quiet -m "$TITLE"
          git push --quiet --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "Updated existing bump PR to ${NEW_VERSION}."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "Opened bump PR for ${NEW_VERSION}."
          fi
