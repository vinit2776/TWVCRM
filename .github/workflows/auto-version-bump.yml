name: Auto bump version

on:
  push:
    branches: [main]

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    # Skip if this push was the version bump itself — prevents infinite loop
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest main before bumping
        run: git pull --rebase origin main

      - name: Bump patch version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const parts = pkg.version.split('.');
            // Support both 3-digit (1.0.90) and 4-digit (1.0.90.0) versioning
            parts[parts.length - 1] = String(parseInt(parts[parts.length - 1], 10) + 1);
            pkg.version = parts.join('.');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Bumped to', pkg.version);
          "

      - name: Commit and push
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin main
